<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Table Sample</title>
  <style>
    table { border-collapse: collapse; width: 60%; }
    th, td { border: 1px solid #666; padding: 8px; text-align: left; }
    th { background: #f0f0f0; }
    caption { caption-side: top; font-weight: bold; margin-bottom: 8px; }
  </style>
</head>
<body>
  <table>
    <caption>サンプル表</caption>
    <thead>
      <tr>
        <th>番号</th>
        <th>項目</th>
        <th>備考</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td>1</td>
        <td>りんご</td>
        <td>赤い果物</td>
      </tr>
      <tr>
        <td>2</td>
        <td>バナナ</td>
        <td>黄色い果物</td>
      </tr>
      <tr>
        <td>3</td>
        <td>みかん</td>
        <td>柑橘類</td>
      </tr>
    </tbody>
  </table>
</body>
</html>
